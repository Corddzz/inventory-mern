version: "3.8"

services:
  web:
    depends_on:
      - api
    build: ./frontend
    ports:
      - 5173:5173

    environment:
      VITE_API_URL: http://localhost:8000
    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild
        - path: ./frontend
          target: /app
          action: sync

  api:
    depends_on:
      db:
        condition: service_healthy
    build: ./backend
    ports:
      - 8000:8000
    environment:
      PORT: 8000
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: lab_inventory
      DB_PORT: 3306
      # CORS_ORIGIN: ${CORS_ORIGIN}
      # JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      # REFRESH_TOKEN: ${REFRESH_TOKEN}
    develop:
      watch:
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/package-lock.json
          action: rebuild
        - path: ./backend
          target: /app
          action: sync

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lab_inventory
    ports:
      - "3309:3306"
    volumes:
      - inventory_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  inventory_data:
